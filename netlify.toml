[build]
  command = "npm run build"
  publish = "ocho/client/dist"
  functions = "netlify/functions"

[functions]
  included_files = ["ocho/server/prisma/**", "api/seed.db"]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
