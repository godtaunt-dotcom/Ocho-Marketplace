[build]
  command = "npm install && npm run build"
  publish = "ocho/client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = [
    "api/seed.db",
    "ocho/server/prisma/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "node_modules/@prisma/engines/**",
    "ocho/node_modules/.prisma/**",
    "ocho/server/node_modules/.prisma/**"
  ]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
