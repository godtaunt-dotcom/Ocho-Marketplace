[build]
  command = "npm install && npm run build && npm --prefix ocho/server run db:deploy"
  publish = "ocho/client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = [
    "ocho/server/prisma/schema.prisma",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "node_modules/@prisma/engines/**"
  ]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
